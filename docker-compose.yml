services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PAYLOAD_SECRET=${PAYLOAD_SECRET}
        - DATABASE_URI=postgresql://postgres:postgres@db:5432/portfolio
        - POSTGRES_URL=postgresql://postgres:postgres@db:5432/portfolio
        - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URI=postgresql://postgres:postgres@db:5432/portfolio
      - POSTGRES_URL=postgresql://postgres:postgres@db:5432/portfolio
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      - GHOST_CONTENT_API_KEY=${GHOST_CONTENT_API_KEY:-}
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
